name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Backend, frontend, Markdown and prototype checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
      - name: Install locked development dependencies
        run: uv sync --locked
      - name: Lint Markdown
        run: uv run pymarkdown scan README.md docs/**/*.md .github/**/*.md
      - name: Validate prototype markup and script
        run: uv run python scripts/check_prototype.py
      - name: Check Django configuration
        run: uv run python backend/manage.py check
      - name: Check local synthetic readiness
        run: uv run python backend/manage.py check_local_readiness
      - name: Check migration consistency
        run: uv run python backend/manage.py makemigrations --check --dry-run
      - name: Lint and format Python
        run: uv run ruff check backend scripts tests && uv run ruff format --check backend scripts tests
      - name: Test Django APIs, organization permissions and invoicing
        run: uv run python backend/manage.py test accounts customers quotations invoicing health hr inventory purchasing
      - name: Test release recovery safeguards
        run: uv run python -m unittest tests.test_semantic_release_recovery
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build React application
        working-directory: frontend
        run: npm run build
