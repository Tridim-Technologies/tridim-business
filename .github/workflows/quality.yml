name: Quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Markdown and prototype checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Node.js for inline prototype script validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked development dependencies
        run: uv sync --locked
      - name: Lint Markdown
        run: uv run pymarkdown scan README.md docs/**/*.md .github/**/*.md
      - name: Validate prototype markup and script
        run: uv run python scripts/check_prototype.py
