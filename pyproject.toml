[project]
name = "tridim-business-tooling"
version = "0.7.0"
description = "Development and release tooling for Tridim Business"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<6.1",
    "djangorestframework>=3.16,<4",
    "dj-database-url>=2.3,<3",
    "psycopg[binary]>=3.2,<4",
    "mpesa-sdk @ git+https://github.com/sartim/mpesa-sdk.git@8f25c2508456aff5dcfd7b1547c776f0b1dce04f",
]

[dependency-groups]
dev = [
    "ruff>=0.11,<1",
    "python-semantic-release>=10,<11",
    "pymarkdownlnt>=0.9,<1",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.semantic_release]
branch = "main"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
build_command = """
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""
commit_message = "chore(release): {version} [skip ci]"
allow_zero_version = true

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "revert", "style", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.pymarkdown]
plugins.md013.enabled = false
plugins.md003.enabled = false
plugins.md033.enabled = false
plugins.md041.enabled = false
plugins.md022.enabled = false
plugins.md032.enabled = false
plugins.md034.enabled = false
plugins.md036.enabled = false
